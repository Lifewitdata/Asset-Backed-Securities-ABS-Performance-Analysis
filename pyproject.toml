[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-research-lab"
version = "1.0.0"
description = "Reproducible ABS cash-flow, index and portfolio research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.11,<2", "statsmodels>=0.14,<0.15", "scikit-learn>=1.3,<2", "cvxpy>=1.4,<2", "dash>=2.17,<4", "plotly>=5.20,<7", "sqlalchemy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "matplotlib>=3.7,<4"]
sqlserver = ["pyodbc>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
